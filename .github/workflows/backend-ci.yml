name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run tests
        run: npm test
      
      - name: Build check
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build ./backend -t blablaride-backend:latest

  # Builds + pushes the backend image, runs pending DB migrations as a
  # one-off ECS task, then deploys the new image to the ECS service.
  # Requires the Terraform stack in infra/aws (specifically module.github_oidc,
  # which needs `github_repo` set to this repo) to already be applied, and
  # these repo settings:
  #   Variables: AWS_REGION, ECR_REPOSITORY, ECS_CLUSTER, ECS_SERVICE,
  #              ECS_TASK_DEFINITION_FAMILY, ECS_SUBNET_IDS (comma-separated),
  #              ECS_SECURITY_GROUP_ID
  #   Secrets:   AWS_DEPLOY_ROLE_ARN (the stack's github_deploy_role_arn output)
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Run database migrations (one-off task)
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          CURRENT_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_DEFINITION_FAMILY }}" \
            --query 'taskDefinition')

          NEW_CONTAINER_DEFS=$(echo "$CURRENT_TASK_DEF" | \
            jq --arg IMAGE "$IMAGE" '.containerDefinitions | map(.image = $IMAGE)')

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --family "${{ vars.ECS_TASK_DEFINITION_FAMILY }}" \
            --task-role-arn "$(echo "$CURRENT_TASK_DEF" | jq -r '.taskRoleArn')" \
            --execution-role-arn "$(echo "$CURRENT_TASK_DEF" | jq -r '.executionRoleArn')" \
            --network-mode "$(echo "$CURRENT_TASK_DEF" | jq -r '.networkMode')" \
            --requires-compatibilities FARGATE \
            --cpu "$(echo "$CURRENT_TASK_DEF" | jq -r '.cpu')" \
            --memory "$(echo "$CURRENT_TASK_DEF" | jq -r '.memory')" \
            --container-definitions "$NEW_CONTAINER_DEFS" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.ECS_SUBNET_IDS }}],securityGroups=[${{ vars.ECS_SECURITY_GROUP_ID }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["npm","run","migration:run:prod"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Waiting for migration task $TASK_ARN to finish..."
          aws ecs wait tasks-stopped --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed with exit code $EXIT_CODE"
            aws logs tail "/ecs/$(echo "${{ vars.ECS_TASK_DEFINITION_FAMILY }}")" --since 10m || true
            exit 1
          fi
          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> "$GITHUB_ENV"

      - name: Deploy new task definition to the service
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"
