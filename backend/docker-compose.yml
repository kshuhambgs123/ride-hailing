services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=blablaride
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=devsecret
    container_name: volo_backend
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=blablaride
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db_backup:
    image: postgres:15-alpine
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh
      - db_backups:/backups
    environment:
      - PGPASSWORD=postgres
    depends_on:
      - db
    entrypoint: |
      sh -c '
      echo "0 * * * * /usr/local/bin/backup.sh" > /etc/crontabs/root
      crond -f -l 8
      '

volumes:
  postgres_data:
  db_backups:
